    <hr>
    <div class="form-details">
        <form style="flex-direction: column;" [formGroup]="deleteForm">
            <div fxFlex="row" *ngIf="accountData.contact_no">
                <div fxFlex="20" fxFlex.sm="50"  fxFlex.xs="0"> 

                    <div class="form-label">Mobile Number *</div>
                </div>
                <div fxFlex="80" fxFlex.sm="50"  fxFlex.xs="0" class="formField">
                    <mat-form-field class="employee-search-field" appearance="legacy">
                        <input matInput formControlName="mobile" readonly autocomplete="off">
                    </mat-form-field>
                </div>
            </div>
            <div fxFlex="row" *ngIf="emailAllow=='1' && accountData.email" class="acc-email-disp">
                <div fxFlex="20" fxFlex.sm="50" fxFlex.xs="0">

                    <div class="form-label">{{emailText}}</div>
                </div>
                <div fxFlex="80" fxFlex.sm="50"  fxFlex.xs="0" class="formField">
                    <mat-form-field class="employee-search-field" appearance="legacy">
                        <input matInput formControlName="email" readonly autocomplete="off">
                    </mat-form-field>
                </div>
            </div>

        </form>
    </div>
    <br>
    <div class="reason" *ngIf="dropdownTextIsAllow=='1'">
        <div class="reasonDeleteTitle*">{{dropdownText}}</div><br>
        <form [formGroup]="deleteForm" class="select-input-field" (ngSubmit)="deleteAccount()">
            <!-- {{deleteForm.value|json}} -->
            <mat-form-field style="width:80%;" appearance="legacy" class="place">
                <mat-select  panelClass="ashish" (opened)="s1(select)" (closed)="s2(select)" #select class="abc"
                    [(value)]="selected" formControlName="desc" placeholder={{dropdownTextPlaceholder}}>
                    <!-- <mat-option [value]="">None</mat-option> -->
                    <mat-option *ngFor="let inspectionType of inspectionTypes" [value]="inspectionType.text">
                        {{inspectionType.text}}</mat-option>
                </mat-select>
                <!-- <input matInput formControlName="desc" placeholder="Please type reason for deletion" autocomplete="off"> -->
                <mat-error
                    *ngIf="deleteForm.controls['desc'].hasError('pattern') || deleteForm.controls['desc'].dirty">
                    <!-- Please enter a reason for deletion (key added to translation service) -->
                     {{'reason_for_deletion'|translate}}
                </mat-error>
            </mat-form-field>
            <!-- <div id="g-recaptcha-0" class="g-recaptcha" data-sitekey="6LdHbTkdAAAAAODFstiotyNLZWXkGA9aRzZuOhYr" data-theme="light" data-widget-id="0"><div style="width: 304px; height: 78px;"><div><iframe title="reCAPTCHA" src="https://www.google.com/recaptcha/api2/anchor?ar=1&amp;k=6LdHbTkdAAAAAODFstiotyNLZWXkGA9aRzZuOhYr&amp;co=aHR0cHM6Ly93d3cuY29kZXNwZWVkeS5jb206NDQz&amp;hl=en&amp;v=5qcenVbrhOy8zihcc2aHOWD4&amp;theme=light&amp;size=normal&amp;cb=osxk0uu1n1mn" width="304" height="78" role="presentation" name="a-1mna51xxehcs" frameborder="0" scrolling="no" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation allow-modals allow-popups-to-escape-sandbox"></iframe></div><textarea id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="width: 250px; height: 40px; border: 1px solid rgb(193, 193, 193); margin: 10px 25px; padding: 0px; resize: none; display: none;"></textarea></div><iframe style="display: none;"></iframe></div> -->
            <div class="captcha">
                <ngx-recaptcha2 #captchaElem [siteKey]="'6LdEx6sdAAAAAPBCtvs_XnG4uLZ2KthmWS6jB-HU'"
                    (success)="handleSuccess($event)" [useGlobalDomain]="false" formControlName="recaptcha">
                </ngx-recaptcha2>
                <div style="color: red;" *ngIf="invalidCapchta">
                    <!-- Please select recaptcha  (key added to translation service)-->
                     {{'select_recaptcha' |translate}}
                                </div>
            </div>
            <br>
            <div class="delete-submit-btn">
                <div class="d-block"><button id="btn-submit" class="btn btn-submit text-uppercase">{{'submit'|translate}}</button></div>
            </div>
        </form>

    </div>
