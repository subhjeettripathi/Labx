<div fxLayout="column" fxLayoutGap="10px">
    <div class="parental-control-content">
        <span class="img-logo" *ngIf="basesignin.account_deletion_success.logo.is_allow == 1">
            <img src="{{basesignin.account_deletion_success.logo.web}}" alt="AOL">
        </span>

        <button (click)="close()" class="close-btn">
            <!-- <mat-icon>close</mat-icon> -->
            <img src="../../../../assets/svgs/Vector.svg" alt="">
        </button>
        <br><br><br>
        <div class="alt-login-img" *ngIf="basesignin.account_deletion_success.success_icon.is_allow == 1">
            <img src="{{basesignin.account_deletion_success.success_icon.web}}" alt="AOL">
        </div>
        <br>

        <!-- <p class="adulttHeading">ADULT CONTENT</p><br> -->
        <p class="deleteSuccess" *ngIf="showDeletion">
            {{basesignin.account_deletion_success.description.text |translate}}
        </p>
        <p class="deleteSuccess" *ngIf="alreadyDeletion">
            {{basesignin.account_deletion_success.description.text2 | translate}}
        </p>

        <br>

        <!-- <div class="row">
                <div class="col-6">
                    <button type="button"  class="btn-one">Yes</button>
                </div>
                <div class="col-6">
                    <button (click)="close()" type="button" class="btn-one">NO</button>
                </div>
            </div> -->


    </div>
</div>
