<div class="alt-login-content">
    <div class="alt-login-img" *ngIf="baseJson.forgot_password.logo.is_allow == 1">
        <img src="{{baseJson.forgot_password.logo.web}}" alt="">
    </div>
    <h3 class="text-white forgot-passowrd " *ngIf="baseJson.forgot_password.heading.is_allow == 1">
        {{'reset_password' |translate}}</h3>
    <hr>
    <button (click)="onNoClick()" class="close-btn">
    <img src="assets/svgs/Vector.svg" alt="">
    </button>
    <div class="">
        <p class="verificationCOde" *ngIf="baseJson.forgot_password.description.is_allow == 1">
            {{'Verification_code' |translate}}</p>
    </div>
    <form [formGroup]="emailLoginForm" #emailLoginFormDir="ngForm" (ngSubmit)="onSubmitEmailLogin()">
        <!-- <div class="formField">
            <mat-label style="color: #DEDEDE!important;">Email Address</mat-label>
            <mat-form-field appearance="outline">
                <input matInput placeholder="Enter Email" formControlName="email" autocomplete="off" required readonly>
                <mat-error
                    *ngIf="emailLoginForm.controls['email'].hasError('pattern') && (emailLoginForm.controls['email'].dirty || emailLoginForm.controls['email'].touched)">
                    Please
                    enter valid email address
                </mat-error>
            </mat-form-field>
            <mat-error *ngIf="!otpExceeded" style="text-align:center !important; font-size: 14px !important; ">
                {{errorMsg.messageOtpResendLimitReached}}
            </mat-error>

        </div> -->
        <div class="input">
            <input type="text" placeholder="{{'enter_email_address'|translate}}" formControlName="email" autocomplete="off" required
                readonly class="forget-input">
            <div class="err-forget"
                *ngIf="emailLoginForm.controls['email'].hasError('pattern') && (emailLoginForm.controls['email'].dirty || emailLoginForm.controls['email'].touched)">
                {{'please_enter_valid_email_address' |translate}}
            </div>
        </div>
        <div *ngIf="!otpExceeded" class="otpExceeded_aol">
            {{'maximum_OTP_limit' |translate}}
        </div>
        <!-- <div class="send-veri" style="width:100%; display: flex; justify-content:center;
        margin-top: 30px;"> -->
            <button type="submit" class="sub-forget" *ngIf="baseJson.forgot_password.submit_btn.is_allow == 1"
                [disabled]="clicked">{{'Send_verification_code' |translate}}</button>
        <!-- </div> -->
    </form>







</div>
