<div class="alt-login-content">
    <div class="alt-login-img" *ngIf="basesignin.mobileLink.logo.is_allow == 1">
        <img src="{{basesignin.mobileLink.logo.web}}" alt="AOL">
    </div>
    <h3 class="text-white verifyEmail " *ngIf="basesignin.mobileLink.heading.is_allow == 1">
        {{basesignin.mobileLink.heading.text |translate}}</h3>
    <!-- <div *ngIf="msg" style="color:red">Please enter mobile number</div> -->
    <br>
    <button (click)="onNoClick()" class="close-btn">
        <mat-icon>Close</mat-icon>
    </button>


    <div>
        <form action="" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="codeDisplay">
                <div>
                    <div id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                        class="country-code-section">
                        <div class="dropdown-toggle">
                            <span class="country-code">{{defaultVal |translate}}</span>
                        </div>
                        <ul aria-labelledby="dropdownMenuButton" class="country-code-lists dropdown-menu">
                            <li onclick="(event||window.event).stopPropagation()" class="search-country-code">
                                <input id="search-country" [(ngModel)]="searchText"
                                    [ngModelOptions]="{ standalone: true }" type="search" aria-label="Search"
                                    autocomplete="off" name="country-code" placeholder="{{'search_country' |translate}}" /><span
                                    class="search-icon text-right"><img class="loginSearch"
                                        src="assets/svgs/searchLogin.svg" alt="AOL"></span>
                            </li>
                            <li class="country-list">
                                <ul>
                                    <li *ngFor="let countr of country | filter: searchText" class="dropdown-item"
                                        (click)="change1(countr.dial_code);changeSelect(countr.dial_code);changeAnotherSelect(
                                          countr.dial_code,
                                          countr.mobile_length
                                        )">
                                        <a class="countryNames">{{ countr.name |translate }}</a><span
                                            class="text-right countryNames">{{ countr.dial_code
                                            }}</span>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="countryField">
                    <input id="myText" class="input-font-alt"
                        placeholder="{{basesignin.mobileLink.input_field.placeholder |translate}}" minlength="10"
                        maxlength="{{this.counts}}"
                        oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*?)\..*/g, '$1');"
                        formControlName="mobile" />


                </div>
                <mat-error *ngIf="loginForm.controls['mobile'].hasError('pattern')">
                    {{'please_enter_valid_mobile_number' |translate}}
                </mat-error>


            </div>

            <br>
            <button *ngIf="basesignin.mobileLink.submit_btn.is_allow == 1"
                class="btn submitEmailLink">{{basesignin.mobileLink.submit_btn.text | translate}}</button>

        </form>
    </div>

</div>
