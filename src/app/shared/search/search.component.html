<div class="section-search sec-top">

  <div class="row">
    <div class="col-xl-6 col-md-6 col-8">
      <div class="search-header">
        <div fxLayout="row" fxLayoutAlign="space-between">
          <h1 class="f-size_aol m-0" *ngIf="viewSearchFilter"><span class="mr-3 arrow-right">
              <img src="assets/svgs/Vector (4).png" style="cursor: pointer;" class="arr-icon" (click)="backSearch()"
                alt="artofliving" aria-hidden="false" class="f-size">
            </span><span>{{searchDataShow}}</span></h1>
        </div>
      </div>
    </div>

    <div class="col-xl-6 col-md-6 col-4">
      <ng-container *ngIf="viewSearchFilter">
        <img src="assets/icons/filter.png" alt="artofliving" class="filterCLoseButton"
          (click)="openCompanyDetailsDialog()">
      </ng-container>
    </div>
    <!-- MOBILE VIEW SEARCH-START -->
    <div class="col-lg-12" *ngIf="!viewSearchFilter">
      <div class="search-hide">
        <div class="ser-icon">
          <img src="assets/svgs/originalsearchicon.svg" alt="artofliving" class="ser-mob-img">
        </div>
        <form [formGroup]="searchDataFormMobile" autocomplete="off">
          <input type="text" class="Search-Input" id="myInput" autocomplete="off"
            placeholder="{{'search_here'|translate}}" (input)="autoSuggest($event)" (keyup.enter)="search_data($event)"
            formControlName="searchMobile" [(ngModel)]="voiceSearch">
          <div class="mic-mobile-icon">
            <img src="assets/svgs/close-search.svg" alt="artofliving" class="srch-icn"
              *ngIf="searchDataFormMobile.value.searchMobile" (click)="clickMObile()">
          </div>
          <div class="mic-mobile-icon-1" *ngIf="btnDisable"><img src="assets/svgs/microphone.svg" alt="artofliving"
              (click)="startService()" *ngIf="btnStyle">
            <img src="assets/svgs/Componentred.svg" alt="artofliving" *ngIf="!btnStyle" width="30px"
              class="filled-icon">
          </div>

        </form>

      </div>
    </div>
    <!-- MOBILE VIEW SEARCH-END -->
  </div>

  <div class="searchBar">

    <form [formGroup]="searchDataForm" #searchDataFormDir="ngForm" class="form-width">
      <div class="searchInput" *ngIf="!viewSearchFilter">
        <div class="search-box">
          <div fxLayoutAlign="center center">
            <button (click)="search_data($event)" type="submit" mat-button mat-icon-button class="searchIcon"
              matTooltip="Buscar">
              <img src="assets/svgs/noun-search-1166289.svg" alt="">
            </button>
            <mat-form-field class="searchField" appearance="standard" fxFlex="100">
              <input (input)="autoSuggest($event)" (keyup.enter)="search_data($event)" #myInput matInput name="search"
                placeholder="{{'Search_result'|translate}}" formControlName="search" [(ngModel)]="voiceSearch"
                class="mat-elevation-z0" autocomplete="anyrandomstring">

            </mat-form-field>

            <div class="mic-clear">
              <ng-container *ngIf="searchDataForm.value.search">
                <div (click)="clear()">
                  <span><img src="assets/svgs/Vector.svg" alt="" width="25px" style="cursor: pointer;"></span>
                </div>
              </ng-container>
              <div class="mic-mobile-icon-1" *ngIf="btnDisable"><img src="assets/img/microphone_unactive.svg"
                  alt="artofliving" (click)="startService()" *ngIf="btnStyle" width="30px" style="cursor: pointer;">
                <img src="assets/img/microphone-_active.svg" alt="artofliving" *ngIf="!btnStyle" width="30px"
                  class="filled-icon" width="30px">
              </div>
            </div>
          </div>
        </div>
      </div>

    </form>
  </div>
  <!-- content -->
  <div *ngIf="show" class="row noSearchResult">
    <ng-container>
      <div class=" searchText">
        {{'No_Search_results'|translate}}
      </div>
    </ng-container>
  </div>
  <ng-container *ngIf="searchRes">
    <div class="search-content" fxLayout="row" fxLayoutAlign="space-between">
      <div class="popularSearch" fxLayout="row" fxLayoutGap="20px">

        <p class="recentSearch" *ngIf="recentSearch ">
          <a class="font-20" [ngStyle]="{'color':popularSearch ? 'white' : '#9B9B9B' }"
            (click)="recent()">{{'RECENT_SEARCHES'|translate}}</a>
        </p>

        <p class="popular-search">
          <a [ngStyle]="{'color':popularSearch ? '#9B9B9B' : 'white' }" class="font-20"
            (click)="popular()">{{'POPULAR_SEARCHES'|translate}}</a>
        </p>

      </div>

      <!-- <div class="setting-option">
              <mat-icon aria-hidden="false" (click)="showSetting()" svgIcon="setting"></mat-icon>
          </div> -->
    </div>

    <div *ngIf="!popularSearch">

      <app-popular-search></app-popular-search>
    </div>
    <div *ngIf="popularSearch">

      <app-recent-search></app-recent-search>
    </div>
  </ng-container>

  <ng-container *ngIf="!searchRes">
    <div id="searchDiv" layout-xs="column" fxLayout="row wrap" flexLayoutAlign="flex-start">
      <ng-container *ngFor="let data of searchData">
        <div fxFlex="16.66%" fxFlex.xs="33.30%" fxFlex.sm="33.30%" fxFlex.md="20%" class="alt-brr-10 alt-p-3 "
          (click)="addRecentSearchData(data.id);navigate(data)">
          <img [src]="data.sliderImg || defaultThumb" [ngStyle]="{'border-radius':'8px','height':'auto','width':'100%'}"
            class="alt-brr-10" [alt]="data.is_group == 0 ? data.title : data.season_title"
            [title]="data.is_group == 0 ? data.title : data.season_title" />

          <div *ngIf="data.is_ad != 1">
            <div class="icons_art" [ngStyle]="{display: data?.content_type == 'audio' ? 'flex' : 'none'}">
              <img src="assets/svgs/headphone.svg" class="music_art" alt="">
            </div>
            <div class="icons_art" [ngStyle]="{display: data?.content_type == 'ebook' ? 'flex' : 'none'}">
              <img src="assets/svgs/e-book.svg" class="music_art" alt="">


            </div>
            <div class="icons_art" [ngStyle]="{display: data?.content_type == 'video' ? 'flex' : 'none'}">
              <img src="assets/svgs/video_icon.svg" class="music_art" alt="">


            </div>
            <div class="icon-crown"
              *ngIf="data.access_type == 'paid'   && data.package_mode !== 'Prime'  && !isSubscribed">
              <img src="assets/svgs/aol_crown.svg" class="aol_crown" alt="AOL">
            </div>

            <div class=" free-icon "
              *ngIf="data.access_type == 'free'  && data.package_mode !== 'Prime'  && !isSubscribed">
              <img src="assets/svgs/free-v1.svg" class="free_aol-icon" alt="AOL" />
            </div>
            <div class="prime-icon" *ngIf="data.package_mode == 'Prime'  ">
              <img src="assets/svgs/lock-prime-v2.svg" class="free_aol" alt="AOL" />
            </div>
          </div>

          <div>
            <p *ngIf="data.is_group==0" class="title_case">{{data.title}}</p>
            <p *ngIf="data.is_group==1" class="title_case">{{data.season_title}} - (Season)</p>

          </div>
        </div>

      </ng-container>

    </div>
  </ng-container>



</div>
